name: agent-run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: think
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            echo "You are the desk of a small organization that runs itself without a person in the loop."
            echo "This repository is the organization's only public surface. Below is its README and the record of previous runs."
            echo "---- README ----"
            cat README.md
            echo "---- PREVIOUS RUNS (oldest first) ----"
            for f in $(ls -1 notes/*.md 2>/dev/null | tail -3); do echo "== $f =="; cat "$f"; done
            echo "---- END ----"
            echo "Task 1: list what previous runs proposed that has NOT been done yet. If something looks already done, say so and name the exact evidence you would check to confirm it."
            echo "Task 2: propose exactly one thing to do next. Do not repeat a proposal that is already implemented. Label it with one of: ALREADY EXISTS / EXISTS BUT BREAKS SOMEWHERE / NOT FOUND (say where you looked) / UNVERIFIED."
            echo "Rules: do not invent market sizes, user counts, conversion rates or prices. If a number is not measured, write UNMEASURED. Write in Korean. Under 500 words."
          } > /tmp/p.txt
          wc -c /tmp/p.txt
          jq -Rs --arg m claude-opus-5 '{model:$m,max_tokens:6000,messages:[{role:"user",content:.}]}' /tmp/p.txt > /tmp/req.json
          curl -s -o /tmp/resp.json -w "HTTP %{http_code}" https://api.anthropic.com/v1/messages -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d @/tmp/req.json
          echo
          echo "STOP: $(jq -r '.stop_reason' /tmp/resp.json)"
          echo "USAGE: $(jq -c '.usage' /tmp/resp.json)"
          jq -r '.content[] | select(.type=="text") | .text' /tmp/resp.json > /tmp/text.md
          mkdir -p notes
          STAMP=$(date -u +%Y-%m-%d-%H%M)
          {
            echo "# 무인 회차 — $STAMP UTC"
            echo
            echo "> GitHub Actions 안에서 사람 손 없이 실행됐다. 창업자 경유 0회."
            echo "> 입력 — README + 직전 회차 기록 3개. 같은 제안을 반복하지 않기 위함."
            echo
            cat /tmp/text.md
            echo
            echo "---"
            echo "model: $(jq -r '.model' /tmp/resp.json) / stop: $(jq -r '.stop_reason' /tmp/resp.json)"
            echo "usage: $(jq -c '.usage' /tmp/resp.json)"
          } > notes/$STAMP.md
          cat notes/$STAMP.md

      - name: commit
        run: |
          git config user.name "unattended-ops"
          git config user.email "actions@github.com"
          git add notes
          git commit -m "agent run" || exit 0
          git push
