name: agent-run
on:
  workflow_dispatch:
  schedule:
    # 06:00 정각은 GitHub 스케줄 혼잡 구간이다 — 2026-08-20 실측 55분 지연.
    # 20:40 UTC = 05:40 KST. 밀려도 06시 언저리에 떨어진다.
    - cron: "40 20 * * *"
permissions:
  contents: write
env:
  DEV_USER: unmannedops
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ── 06시 슬롯 = reach-kr (2026-08-17 창업자 승인) ──
      - name: measure-dev
        env:
          DEV_KEY: ${{ secrets.DEV_API_KEY }}
        run: |
          set +e
          : > /tmp/dev.txt
          echo "== A. 계정 상태 (읽기 · 질의 2형태) ==" >> /tmp/dev.txt
          for form in "https://dev.to/api/articles?username=$DEV_USER&per_page=100" \
                      "https://dev.to/api/articles/latest?username=$DEV_USER&per_page=100"; do
            code=$(curl -s -o /tmp/list.json -w '%{http_code}' "$form")
            n=$(jq 'length' /tmp/list.json 2>/dev/null || echo PARSE_FAIL)
            echo "HTTP $code / 건수 $n" >> /tmp/dev.txt
          done
          echo "--- 글 목록 ---" >> /tmp/dev.txt
          jq -r '.[] | "id=\(.id) at=\(.published_at) reactions=\(.public_reactions_count) comments=\(.comments_count) :: \(.title)"' \
            /tmp/list.json >> /tmp/dev.txt 2>/dev/null
          cat /tmp/dev.txt
      # ── §9-3 회신 원장 (2026-08-25 창업자 승인) ──
      # measure-dev가 방금 받은 /tmp/list.json(최신 목록, comments_count 포함)을 그대로 쓴다.
      # 새 API 호출을 하지 않는다 — 위 단계 값을 재사용한다.
      # id별 직전 댓글 수를 log/댓글-카운트.json에 저장해 두고, 늘었으면
      # notes/회신-원장.md에 한 줄 append 한다. 안 늘었으면 아무것도 안 쓴다.
      - name: reply-ledger
        run: |
          set +e
          mkdir -p log notes
          PREV=log/댓글-카운트.json
          [ -f "$PREV" ] || echo '{}' > "$PREV"
          : > /tmp/reply_new.txt
          if [ -f /tmp/list.json ]; then
            jq -c '.[] | {id, comments: .comments_count, title}' /tmp/list.json 2>/dev/null > /tmp/reply_rows.jsonl
          else
            : > /tmp/reply_rows.jsonl
          fi
          while IFS= read -r row; do
            [ -z "$row" ] && continue
            id=$(echo "$row" | jq -r '.id')
            cnt=$(echo "$row" | jq -r '.comments')
            title=$(echo "$row" | jq -r '.title')
            prev=$(jq -r --arg id "$id" '.[$id] // 0' "$PREV")
            case "$cnt" in ''|*[!0-9]*) cnt=0 ;; esac
            case "$prev" in ''|*[!0-9]*) prev=0 ;; esac
            if [ "$cnt" -gt "$prev" ]; then
              diff=$((cnt - prev))
              echo "- $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC · id=$id · comments $prev -> $cnt (+$diff) · $title" >> /tmp/reply_new.txt
            fi
          done < /tmp/reply_rows.jsonl
          # 이번 조회값으로 카운트 전체를 덮어쓴다 (id를 문자열 키로 저장)
          if [ -s /tmp/reply_rows.jsonl ]; then
            jq -s 'map({(.id|tostring): .comments}) | add // {}' /tmp/reply_rows.jsonl > "$PREV.tmp" \
              && mv "$PREV.tmp" "$PREV"
          fi
          if [ -s /tmp/reply_new.txt ]; then
            {
              echo ""
              echo "## 신규 회신 — $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC"
              cat /tmp/reply_new.txt
            } >> notes/회신-원장.md
            echo "신규 회신 $(wc -l < /tmp/reply_new.txt | tr -d ' ')건 — notes/회신-원장.md에 기록"
            cat /tmp/reply_new.txt
          else
            echo "신규 회신 없음 (증가분 0)"
          fi
      # ── C안 게이트 (2026-08-17 창업자 승인) ──
      # 「발행 직전 계정 조회 1회를 통과한 건만 무인 발행한다」
      # 규칙을 늘리지 않고 여기서 강제한다. 코드가 규칙보다 강하다.
      # ── 생성 게이트 (2026-08-24 창업자 승인) ──
      # outbox/에 이미 들어와 있는 원고를 발행 전에 검사한다.
      # P1(회사 내부 사실 낱말) + 형식 5축, 둘 다 통과해야 발행으로 넘어간다.
      # REJECT면 발행하지 않고 notes/rejected/로 옮긴다. 이 단계는 원고를
      # 스스로 짓지 않는다 — 이미 outbox/에 있는 파일만 검사한다.
      - name: generation-gate
        run: |
          set +e
          SRC=$(ls -1 outbox/*.md 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "게이트 대상 없음 — outbox 비어 있음"
            exit 0
          fi
          echo "게이트 대상: $SRC"
          python3 gen_gate.py "$SRC"
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "🔴 생성 게이트 REJECT — $SRC 를 notes/rejected/로 옮기고 이번 회차는 발행하지 않는다"
            mkdir -p notes/rejected
            git mv "$SRC" "notes/rejected/$(basename "$SRC")" 2>/dev/null || mv "$SRC" "notes/rejected/"
          else
            echo "게이트 PASS — $SRC"
          fi
      - name: publish-gated
        env:
          DEV_KEY: ${{ secrets.DEV_API_KEY }}
        run: |
          set +e
          : > /tmp/pub.txt
          SRC=$(ls -1 outbox/*.md 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "발행 후보 없음 (outbox/ 비어 있음) — 이 회차는 발행하지 않는다" >> /tmp/pub.txt
            cat /tmp/pub.txt; exit 0
          fi
          echo "발행 후보: $SRC" >> /tmp/pub.txt
          TITLE=$(sed -n 's/^title:[[:space:]]*//p' "$SRC" | head -1 | sed 's/^"//; s/"$//')
          TAGS=$(sed -n 's/^tags:[[:space:]]*//p' "$SRC" | head -1)
          BODY=$(awk 'BEGIN{d=0} d<2 && /^---[[:space:]]*$/{d++; next} d>=2{print}' "$SRC")
          if [ -z "$TITLE" ] || [ -z "$BODY" ]; then
            echo "🔴 게이트 중단 — 제목 또는 본문을 못 읽었다. 발행하지 않는다" >> /tmp/pub.txt
            cat /tmp/pub.txt; exit 0
          fi
          echo "제목: $TITLE" >> /tmp/pub.txt
          # ── 게이트 ① 계정 조회 1회 (지금 다시 친다. 위 단계 값을 재사용하지 않는다) ──
          gcode=$(curl -s -o /tmp/g.json -w '%{http_code}' \
            "https://dev.to/api/articles?username=$DEV_USER&per_page=100&t=$(date +%s)")
          gn=$(jq 'length' /tmp/g.json 2>/dev/null || echo PARSE_FAIL)
          echo "게이트 조회: HTTP $gcode / 건수 $gn" >> /tmp/pub.txt
          if [ "$gcode" != "200" ] || [ "$gn" = "PARSE_FAIL" ]; then
            echo "🔴 게이트 중단 — 계정 상태를 못 읽었다. 못 읽었으면 발행하지 않는다" >> /tmp/pub.txt
            cat /tmp/pub.txt; exit 0
          fi
          # ── 게이트 ② 같은 제목이 이미 계정에 있는가 (18행·§2-R이 막던 것) ──
          norm() { echo "$1" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]'; }
          NT=$(norm "$TITLE")
          DUP=$(jq -r '.[].title' /tmp/g.json | while read -r t; do
                  [ "$(norm "$t")" = "$NT" ] && echo HIT; done | head -1)
          if [ "$DUP" = "HIT" ]; then
            echo "🔴 게이트 중단 — 같은 제목이 계정에 이미 있다. 중복 게시를 막았다" >> /tmp/pub.txt
            cat /tmp/pub.txt; exit 0
          fi
          echo "게이트 통과 — 계정에 같은 제목 없음" >> /tmp/pub.txt
          # ── 발행 ──
          jq -n --arg t "$TITLE" --arg b "$BODY" --arg g "$TAGS" \
            '{article:{title:$t,published:true,body_markdown:$b,tags:($g|split(",")|map(gsub("^ +| +$";"")))}}' \
            > /tmp/post.json
          pcode=$(curl -s -o /tmp/presp.json -w '%{http_code}' \
            -X POST https://dev.to/api/articles \
            -H "api-key: $DEV_KEY" -H "Content-Type: application/json" -d @/tmp/post.json)
          echo "POST(published:true) -> HTTP $pcode" >> /tmp/pub.txt
          echo "--- 응답 본문 (상태 코드가 아니라 이것을 읽는다) ---" >> /tmp/pub.txt
          head -c 900 /tmp/presp.json >> /tmp/pub.txt
          echo "" >> /tmp/pub.txt
          # ── 사후 확인: 문서가 아니라 계정에서 다시 잰다 ──
          NEWID=$(jq -r '.id // empty' /tmp/presp.json)
          if [ -n "$NEWID" ]; then
            sleep 5
            vcode=$(curl -s -o /tmp/v.json -w '%{http_code}' "https://dev.to/api/articles/$NEWID?t=$(date +%s)")
            echo "확인 GET /api/articles/$NEWID -> HTTP $vcode" >> /tmp/pub.txt
            echo "published_at = $(jq -r '.published_at // "없음"' /tmp/v.json)" >> /tmp/pub.txt
            echo "url = $(jq -r '.url // "없음"' /tmp/v.json)" >> /tmp/pub.txt
            mkdir -p published && git mv "$SRC" "published/$(basename "$SRC")" 2>/dev/null || mv "$SRC" "published/"
            echo "판정: 발행 완료 — id=$NEWID" >> /tmp/pub.txt
          else
            echo "판정: 발행 안 됨 또는 미확인 — 위 본문을 그대로 대장에 옮긴다. outbox는 그대로 둔다" >> /tmp/pub.txt
          fi
          cat /tmp/pub.txt
      # ── §9 발행 요약 (2026-08-25 창업자 승인) ──
      # 위 단계들이 이미 만들어 둔 /tmp/pub.txt · /tmp/reply_new.txt를 읽기만 한다.
      # 새로 계산하지 않는다 — 사람이 Actions 실행 화면 Summary 탭에서
      # 로그를 안 뒤지고도 "발행됐는지 / 게이트가 막았는지 / 신규 회신이 왔는지"를 바로 보게 한다.
      - name: publish-summary
        run: |
          set +e
          {
            echo "### 발행 요약 — $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC"
            if [ -f /tmp/pub.txt ]; then
              if grep -q '판정: 발행 완료' /tmp/pub.txt; then
                ID=$(grep -o 'id=[0-9]*' /tmp/pub.txt | tail -1)
                URL=$(grep '^url = ' /tmp/pub.txt | sed 's/^url = //')
                echo "- ✅ 발행됨 — $ID"
                echo "- 주소 — $URL"
              elif grep -q '게이트 중단' /tmp/pub.txt; then
                REASON=$(grep '게이트 중단' /tmp/pub.txt | tail -1 | sed 's/^🔴 게이트 중단 — //')
                echo "- 🔴 게이트가 막았다 — $REASON"
              elif grep -q '발행 후보 없음' /tmp/pub.txt; then
                echo "- ⚪ 발행 후보 없음 — outbox 비어 있음"
              else
                echo "- 🔴 판정 불명 — /tmp/pub.txt 원문 확인 필요"
              fi
            else
              echo "- (발행 단계 실행 안 됨)"
            fi
            if [ -s /tmp/reply_new.txt ]; then
              echo "- 🆕 신규 회신 $(wc -l < /tmp/reply_new.txt | tr -d ' ')건"
            else
              echo "- 신규 회신 없음"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: think
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            echo "너는 이 조직의 도달 자리(reach-kr)다. 이 회차는 사람 손 없이 돈다."
            echo "아래는 README, 직전 회차 기록, 그리고 이번 회차가 방금 잰 값이다."
            echo "---- README ----"
            cat README.md
            echo "---- PREVIOUS RUNS (oldest first) ----"
            for f in $(ls -1 notes/*.md 2>/dev/null | tail -3); do echo "== $f =="; cat "$f"; done
            echo "---- 계정 실측 ----"
            cat /tmp/dev.txt
            echo "---- 발행 게이트 결과 ----"
            cat /tmp/pub.txt 2>/dev/null || echo "(단계 없음)"
            echo "---- END ----"
            echo "과제 1: 위 실측만 근거로 세 칸을 적는다. 문서에서 읽은 값을 쓰지 않는다."
            echo "  (1) 올린 것 — 글 수와 id. 두 질의의 건수가 다르면 그 사실을 먼저 적는다."
            echo "  (2) 회신 — 반응/댓글만. 조회수·노출·좋아요는 회신이 아니다. 직전 회차와 비교해 늘었으면 id와 증가분."
            echo "  (3) 꺼내졌다 — 안(플랫폼 목록·태그) / 밖(검색엔진) 두 칸. 안 재봤으면 둘 다 미측정."
            echo "과제 2: 발행 게이트 결과를 한 줄로 판정한다 — 발행함 / 게이트가 막음(이유) / 후보 없음 / 실패(본문 인용)."
            echo "과제 3: 다음에 할 일을 정확히 하나 제안한다. 이미 된 것을 다시 제안하지 않는다."
            echo "규칙: 숫자를 지어내지 않는다. 안 센 것은 미실측, 대조 못 한 것은 미확인 — 0과 같은 칸에 적지 않는다."
            echo "규칙: 어떤 회사의 내부 사실도 쓰지 않는다. 「올렸다」를 「꺼내졌다」 칸에 적지 않는다."
            echo "출력: 한국어, 500단어 이내."
          } > /tmp/p.txt
          wc -c /tmp/p.txt
          jq -Rs --arg m claude-opus-5 '{model:$m,max_tokens:6000,messages:[{role:"user",content:.}]}' /tmp/p.txt > /tmp/req.json
          curl -s -o /tmp/resp.json -w "HTTP %{http_code}" https://api.anthropic.com/v1/messages -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d @/tmp/req.json
          echo
          echo "STOP: $(jq -r '.stop_reason' /tmp/resp.json)"
          jq -r '.content[] | select(.type=="text") | .text' /tmp/resp.json > /tmp/text.md
          mkdir -p notes
          STAMP=$(date -u +%Y-%m-%d-%H%M)
          {
            echo "# 무인 회차 (reach-kr) — $STAMP UTC"
            echo
            echo "> GitHub Actions 안에서 사람 손 없이 실행됐다. 창업자 경유 0회."
            echo "> 발행 게이트 = C안 (2026-08-17 창업자 승인) — 계정 조회 1회를 통과한 건만 발행한다."
            echo
            cat /tmp/text.md
            echo
            echo "---"
            echo "## 원자료 — 계정 실측"
            echo '```'
            cat /tmp/dev.txt
            echo '```'
            echo "## 원자료 — 발행 게이트"
            echo '```'
            cat /tmp/pub.txt 2>/dev/null
            echo '```'
            echo "---"
            echo "model: $(jq -r '.model' /tmp/resp.json) / stop: $(jq -r '.stop_reason' /tmp/resp.json)"
            echo "usage: $(jq -c '.usage' /tmp/resp.json)"
          } > notes/$STAMP.md
          cat notes/$STAMP.md
      # ── ① 회의실 안건 투입 (2026-08-19 신설 · 무인) ──
      # 발행이 정상이 아닐 때만 안건/ 에 파일 1개를 쓴다.
      # 맥의 회의실 진행기가 60초 폴링으로 집어 스스로 회의를 연다. 창업자 경유 0.
      # 발행이 정상인 날도 「일일 보고」 1건을 남긴다 — 사회 1콜이 걸러 방에 두 줄만 뜬다.
      # 성공도 침묵이면 창업자가 매일 저장소를 열어봐야 한다(경유 증가). 2026-08-20 창업자 승인.
      - name: agenda
        run: |
          set +e
          P=/tmp/pub.txt
          if [ ! -f "$P" ]; then
            echo "발행 게이트 기록이 없다 — 안건 없음"; exit 0
          fi
          STAMP=$(date -u +%Y-%m-%d-%H%M)
          NOUT=$(ls -1 outbox/*.md 2>/dev/null | wc -l | tr -d ' ')
          NPUB=$(ls -1 published/*.md 2>/dev/null | wc -l | tr -d ' ')
          mkdir -p 안건
          if grep -q '판정: 발행 완료' "$P"; then
            F="안건/${STAMP}-발행정상-누적${NPUB}편-큐${NOUT}건.md"
            {
              echo "# 일일 보고 — 발행 정상. 이상 없음."
              echo
              echo "**이 파일은 회차 보고다. 판정이 갈리는 것이 없다. 토론할 값이 아니다.**"
              echo
              echo "## 알려진 사실"
              echo "- 회차 — $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC · 06시 슬롯 · reach-kr · 사람 손 0회"
              echo "- 발행 — 완료"
              echo "- published/ 누적 — ${NPUB}건"
              echo "- outbox/ 남은 발행 후보 — ${NOUT}건"
            } > "$F"
            echo "일일 보고 1건 생성 — $F"
            cat "$F"
            exit 0
          fi
          if grep -q '발행 후보 없음' "$P"; then
            SUBJ="발행 큐가 비었다 — 이번 회차에 밖으로 나간 것이 0건이다"
          elif grep -q '게이트 중단' "$P"; then
            SUBJ="발행 게이트가 막았다 — 무엇이 막았고 다시 열려면 무엇이 필요한가"
          else
            SUBJ="발행을 시도했으나 확인되지 않았다 — 발행함/안 함 중 무엇으로 셀 것인가"
          fi
          {
            echo "# $SUBJ"
            echo
            echo "## 알려진 사실"
            echo "- 회차 — $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC · 06시 슬롯 · reach-kr · 사람 손 0회"
            echo "- outbox/ 발행 후보 — ${NOUT}건"
            echo "- published/ 누적 — ${NPUB}건"
            echo "- 발행 게이트 원자료 —"
            sed 's/^/  /' "$P"
            echo
            echo "## 조직 규칙"
            echo "- 밖으로 나간 것이 0인 주는 돈 것이 아니라 쌓인 주다"
            echo "- 만든 것을 큐에 못 넣으면 원고를 더 만들어도 발행 편수는 안 는다"
            echo "- 숫자를 지어내지 않는다. 안 센 것은 미실측, 대조 못 한 것은 미확인"
          } > "안건/${STAMP}-발행결과.md"
          echo "안건 1건 생성 — 안건/${STAMP}-발행결과.md"
          cat "안건/${STAMP}-발행결과.md"
      - name: commit
        run: |
          set +e
          git config user.name "unattended-ops"
          git config user.email "actions@github.com"
          # 🔴 2026-08-19 실측 — `git add -A a b c` 는 하나라도 없는 경로가 있으면
          # 전체가 exit 128 로 죽고 **아무것도 담기지 않는다**. outbox/ 가 비면서 드러났다.
          # 그래서 폴더를 먼저 만들고, 하나씩 담는다.
          mkdir -p notes outbox published 안건 log
          [ -e outbox/.gitkeep ] || : > outbox/.gitkeep
          for d in notes outbox published 안건 log; do
            [ -d "$d" ] && git add -A "$d"
          done
          echo "--- 담긴 것 ---"
          git diff --cached --name-only
          git commit -m "reach-kr run" || exit 0
          git push
