name: agent-run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: think
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            echo "You are the build desk of a small organization that runs itself without a person in the loop."
            echo "Below is the README and the full source of our only public artifact."
            echo "---- README ----"
            cat README.md
            echo "---- INDEX.HTML ----"
            cat index.html
            echo "---- END ----"
            echo "Task 1: the tool claims it never merges the answer 'do not know' into 'no'. Verify that claim against the actual scoring code above. Quote the exact line or lines you checked. Answer VERIFIED or CONTRADICTED, and say what input would prove it."
            echo "Task 2: name the single highest-value change to make next, and label it with one of: ALREADY EXISTS / EXISTS BUT BREAKS SOMEWHERE / NOT FOUND (say where you looked) / UNVERIFIED."
            echo "Rules: do not invent market sizes, user counts, conversion rates or prices. If a number is not measured, write UNMEASURED. Write in Korean. Under 500 words."
          } > /tmp/p.txt
          wc -c /tmp/p.txt
          jq -Rs --arg m claude-opus-5 '{model:$m,max_tokens:6000,messages:[{role:"user",content:.}]}' /tmp/p.txt > /tmp/req.json
          curl -s -o /tmp/resp.json -w "HTTP %{http_code}" https://api.anthropic.com/v1/messages -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d @/tmp/req.json
          echo
          echo "STOP: $(jq -r '.stop_reason' /tmp/resp.json)"
          echo "USAGE: $(jq -c '.usage' /tmp/resp.json)"
          jq -r '.content[] | select(.type=="text") | .text' /tmp/resp.json > /tmp/text.md
          mkdir -p notes
          STAMP=$(date -u +%Y-%m-%d-%H%M)
          {
            echo "# 무인 회차 — $STAMP UTC"
            echo
            echo "> GitHub Actions 안에서 사람 손 없이 실행됐다. 창업자 경유 0회."
            echo "> 입력은 README + index.html 전문이다 — 실제 회차 규모 비용을 재기 위함."
            echo
            cat /tmp/text.md
            echo
            echo "---"
            echo "model: $(jq -r '.model' /tmp/resp.json) / stop: $(jq -r '.stop_reason' /tmp/resp.json)"
            echo "usage: $(jq -c '.usage' /tmp/resp.json)"
          } > notes/$STAMP.md
          cat notes/$STAMP.md

      - name: commit
        run: |
          git config user.name "unattended-ops"
          git config user.email "actions@github.com"
          git add notes
          git commit -m "agent run" || exit 0
          git push
