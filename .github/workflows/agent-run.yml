name: agent-run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: think
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            echo "You are the research desk of a small organization trying to run itself without a person in the loop."
            echo "Below is the current state of our only public artifact: a 30-question self-check tool."
            echo "---- README ----"
            cat README.md
            echo "---- END README ----"
            echo "Task 1: name the three questions a first-time visitor would still have after reading this, which the tool does not answer."
            echo "Task 2: propose exactly one thing to build next, and label it with one of these four: ALREADY EXISTS / EXISTS BUT BREAKS SOMEWHERE / NOT FOUND (say where you looked) / UNVERIFIED."
            echo "Rules: do not invent market sizes, user counts, conversion rates or prices. If a number is not measured, write UNMEASURED. Write in Korean. Under 400 words."
          } > /tmp/p.txt
          jq -Rs --arg m claude-opus-5 '{model:$m,max_tokens:1500,messages:[{role:"user",content:.}]}' /tmp/p.txt > /tmp/req.json
          curl -s -o /tmp/resp.json -w "HTTP %{http_code}" https://api.anthropic.com/v1/messages -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d @/tmp/req.json
          echo
          echo "USAGE: $(jq -c '.usage' /tmp/resp.json)"
          mkdir -p notes
          DATE=$(date -u +%Y-%m-%d)
          {
            echo "# 무인 회차 기록 — $DATE"
            echo
            echo "> GitHub Actions 안에서 사람 손 없이 실행됐다. 창업자 경유 0회."
            echo
            jq -r '.content[0].text' /tmp/resp.json
            echo
            echo "---"
            echo "model: $(jq -r '.model' /tmp/resp.json)"
            echo "usage: $(jq -c '.usage' /tmp/resp.json)"
          } > notes/$DATE.md
          cat notes/$DATE.md

      - name: commit
        run: |
          git config user.name "unattended-ops"
          git config user.email "actions@github.com"
          git add notes
          git commit -m "agent run" || exit 0
          git push
